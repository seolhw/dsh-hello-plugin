name = "dsh-talk-server"
main = "packages/server/src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 本地开发（wrangler dev --port 8787）
[dev]
port = 8787
local_protocol = "http"

# ---------- D1：元数据库（用户 / 社区 / 频道 / 消息 / 分享） ----------
[[d1_databases]]
binding = "DB"
database_name = "dsh-talk-server"
database_id = "placeholder-local-dev-only"

# ---------- R2：附件 / 会话克隆包 / workflow 载荷 ----------
[[r2_buckets]]
binding = "R2"
bucket_name = "dsh-talk-assets"
preview_bucket_name = "dsh-talk-assets-local"

# ---------- Durable Object：每频道一个 RoomActor（实时广播） ----------
[durable_objects]
bindings = [
  { name = "ROOM_ACTOR", class_name = "RoomActor", script_name = "dsh-talk-server" },
]

# DO 迁移声明
[[migrations]]
tag = "v1-room-actor"
new_classes = ["RoomActor"]

# ---------- 环境变量（dev 默认值；生产用 wrangler secret put 覆盖） ----------
[vars]
COMMUNITY_CREATE_DAILY_LIMIT = "3"
MAX_COMMUNITIES_PER_USER = "10"
ADMIN_HANDLES = ""
MAX_MESSAGE_LENGTH = "4000"
MAX_SHARE_BYTES = "52428800"
# 注意：AUTH_INVITE_CODES 含秘密，不要写死在 toml 里，用以下方式注入：
#   本地：AUTH_INVITE_CODES="xxx,yyy" pnpm dev
#   生产：wrangler secret put AUTH_INVITE_CODES
