name = "dsh-talk-server"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 本地开发（wrangler dev --port 8787）
[dev]
port = 8787
local_protocol = "http"

# ---------- D1：元数据库（用户 / 社区 / 频道 / 消息 / 分享） ----------
[[d1_databases]]
binding = "DB"
database_name = "dsh-talk-server"
database_id = "placeholder-local-dev-only"

# ---------- R2：附件 / 会话克隆包 / workflow 载荷 ----------
[[r2_buckets]]
binding = "R2"
bucket_name = "dsh-talk-assets"
preview_bucket_name = "dsh-talk-assets-local"

# ---------- Durable Object：每频道一个 RoomActor（实时广播） ----------
[durable_objects]
bindings = [
  { name = "ROOM_ACTOR", class_name = "RoomActor", script_name = "dsh-talk-server" },
]

# DO 迁移声明
[[migrations]]
tag = "v1-room-actor"
new_classes = ["RoomActor"]

# ---------- 环境变量（生产用 wrangler secret put；本地 pnpm dev 自动把 .env 同步到 .dev.vars） ----------
# 认证相关只保留密钥/凭据 + 认证 URL；其余策略均为代码常量（见 src/constants.ts 与 src/lib/auth.ts）：
#   BETTER_AUTH_URL      认证服务对外地址（可选）：GitHub OAuth 回调 / 邮箱验证 / 重置链接都基于它。
#                        例如本地 http://localhost:8787（GitHub 回调即 {BETTER_AUTH_URL}/api/auth/callback/github）。
#                        留空时按请求 Host 推导。
#   BETTER_AUTH_SECRET   会话签名密钥（≥32 字符，必填）
#   GITHUB_CLIENT_ID     GitHub OAuth 凭据（配置后出现「GitHub 登录」）
#   GITHUB_CLIENT_SECRET
#   RESEND_API_KEY       事务邮件（邮箱验证 / 找回密码）
